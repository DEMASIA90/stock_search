name: Build 바닥의 민족 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # v1.1 FIX:
      # ubuntu-latest must not be assumed to expose sdkmanager on PATH.
      # This action installs Android command-line tools, accepts licenses,
      # sets ANDROID_SDK_ROOT, and adds sdkmanager to PATH.
      - name: Setup Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          command -v sdkmanager
          sdkmanager --version
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic

      - name: Build installable debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk badak-nation.apk
          ls -lh badak-nation.apk

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: badak-nation-apk
          path: badak-nation.apk
          if-no-files-found: error
          retention-days: 14
