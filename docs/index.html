<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#080b12" />
  <meta name="color-scheme" content="dark" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="DTC" />
  <meta name="dtc-ui-build" content="20260821-v11_5" />
  <title>Dongtan Trading Center (DTC)</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="64x64" href="./icons/favicon-64.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="./styles.css?v=20260821-v11_5" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="동탄 트레이딩 센터">
        <span class="dtc-mark" aria-hidden="true"><b>DTC</b><i>↗</i></span>
        <div class="brand-copy">
          <b>동탄 트레이딩 센터 <span>(Dongtan Trading Center, DTC)</span></b>
          <small>모든 투자의 책임은 사실 다른 투자자에게 있습니다.</small>
        </div>
      </a>
      <div class="top-actions">
        <button id="installPwaBtn" class="install-pwa-btn" type="button" hidden>앱 설치</button>
        <button id="reloadBtn" class="icon-btn" type="button" aria-label="새로고침">↻</button>
      </div>
    </header>

    <main>
      <nav class="market-tabs" id="marketTabs" aria-label="시장 선택">
        <button class="market-tab active" data-category="KR">국장</button>
        <button class="market-tab" data-category="KR_ETF">국장ETF</button>
        <button class="market-tab" data-category="US">미장</button>
        <button class="market-tab" data-category="US_ETF">미장ETF</button>
      </nav>

      <nav class="cap-filter-tabs" id="capFilterTabs" aria-label="시가총액 필터">
        <button class="cap-filter" data-cap="10000000000000">10조 이상</button>
        <button class="cap-filter" data-cap="50000000000000">50조 이상</button>
        <button class="cap-filter active" data-cap="100000000000000">100조 이상</button>
        <button class="cap-filter" data-cap="500000000000000">500조 이상</button>
        <button class="cap-filter" data-cap="1000000000000000">1000조 이상</button>
      </nav>

      <section class="summary-row compact-summary">
        <div><p id="scanStatus">—</p></div>
        <div class="summary-meta">
          <b id="marketDate">—</b>
          <span id="coverage">—</span>
        </div>
      </section>

      <section class="search-row">
        <label class="search-box">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.5-4.5m2-5A7 7 0 1 1 4.5 11.5a7 7 0 0 1 14 0Z"/></svg>
          <input id="searchInput" type="search" autocomplete="off" placeholder="종목명 / TICKER 검색" />
          <kbd id="resultCount">—</kbd>
        </label>
      </section>

      <div id="status" class="status">데이터를 불러오는 중입니다.</div>
      <section id="stockList" class="stock-list" aria-label="종목 목록"></section>
    </main>

    <footer>Dongtan Trading Center · DTC · Not investment advice</footer>
  </div>

  <div id="scoreModal" class="modal" hidden>
    <button class="modal-backdrop" type="button" data-close-modal aria-label="닫기"></button>
    <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="scoreModalTitle">
      <header class="modal-head">
        <div>
          <small>SCORE DETAIL</small>
          <h2 id="scoreModalTitle">—</h2>
        </div>
        <button class="modal-close" type="button" data-close-modal aria-label="닫기">×</button>
      </header>
      <div id="scoreModalBody" class="score-detail-body"></div>
    </section>
  </div>

  <script src="./news-config.js?v=20260821-v11_5"></script>
  <script src="./app.js?v=20260821-v11_5"></script>
  <script src="./pwa.js?v=20260821-v11_5"></script>
</body>
</html>
