<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#090b10" />
  <title>Morning Invest</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="mark">M</span>
        <div><b>Morning Invest</b><small id="updated">—</small></div>
      </div>
      <button id="reloadBtn" class="icon-btn" aria-label="새로고침">↻</button>
    </header>

    <main>
      <section class="market-tabs" id="marketTabs">
        <button class="market-tab active" data-market="KR">국장</button>
        <button class="market-tab" data-market="US">미장</button>
      </section>

      <section class="headline">
        <div>
          <span class="eyebrow" id="marketLabel">KOREA</span>
          <h1>TOP 20</h1>
        </div>
        <div class="market-meta">
          <b id="marketDate">—</b>
          <span id="coverage">—</span>
        </div>
      </section>

      <section class="toolbar">
        <button class="sort-btn active" data-sort="rank">추천순</button>
        <button class="sort-btn" data-sort="gap">하단근접</button>
        <button class="sort-btn" data-sort="rsi">RSI</button>
        <button class="sort-btn" data-sort="volume">거래량</button>
      </section>

      <div id="status" class="status">데이터를 불러오는 중입니다.</div>
      <section id="stockList" class="stock-list"></section>
    </main>

    <footer>정보 제공용 · 투자 판단의 책임은 사용자에게 있습니다.</footer>
  </div>

  <div id="modal" class="backdrop" aria-hidden="true">
    <article class="modal">
      <header class="modal-head">
        <div>
          <span id="modalTicker" class="eyebrow"></span>
          <h2 id="modalName"></h2>
        </div>
        <button id="closeModal" class="icon-btn" aria-label="닫기">×</button>
      </header>

      <section class="detail-top">
        <div class="score-box"><b id="modalScore">—</b><span>/100</span></div>
        <div class="detail-price"><strong id="modalPrice">—</strong><span id="modalChange">—</span></div>
      </section>

      <section id="scoreBars" class="score-bars"></section>
      <section id="quoteGrid" class="quote-grid"></section>

      <section class="chart-card">
        <div class="chart-head">
          <b>Price</b>
          <div id="periodTabs" class="period-tabs">
            <button data-days="20">1M</button>
            <button data-days="60">3M</button>
            <button data-days="120">6M</button>
            <button class="active" data-days="180">1Y</button>
          </div>
        </div>
        <div id="chart" class="chart"></div>
        <div class="legend"><span class="price-line">Price</span><span class="sma-line">SMA20</span><span class="band-line">Band</span></div>
      </section>
    </article>
  </div>

  <script src="./app.js"></script>
</body>
</html>
