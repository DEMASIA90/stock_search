<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#080a0f" />
  <meta name="color-scheme" content="dark" />
  <meta name="morning-invest-ui-build" content="20260817-ui1" />
  <title>Morning Invest</title>
  <link rel="stylesheet" href="./styles.css?v=20260817-ui1" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Morning Invest">
        <span class="mark">M</span>
        <div><b>Morning Invest</b><small id="updated">—</small></div>
      </a>
      <button id="reloadBtn" class="icon-btn" aria-label="새로고침">↻</button>
    </header>

    <main>
      <nav class="market-tabs" id="marketTabs" aria-label="시장 선택">
        <button class="market-tab active" data-category="KR">국장</button>
        <button class="market-tab" data-category="US">미장</button>
        <button class="market-tab" data-category="US_ETF">미장 ETF</button>
      </nav>

      <section class="summary">
        <div>
          <span class="eyebrow" id="categoryLabel">KOREA</span>
          <h1>Signals</h1>
        </div>
        <div class="summary-meta">
          <b id="marketDate">—</b>
          <span id="coverage">—</span>
        </div>
      </section>

      <section class="search-row">
        <div class="search-box">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.5-4.5m2-5A7 7 0 1 1 4.5 11.5a7 7 0 0 1 14 0Z"/></svg>
          <input id="searchInput" type="search" autocomplete="off" placeholder="종목명 / 티커 검색" />
          <kbd id="resultCount">—</kbd>
        </div>
      </section>

      <div id="status" class="status">데이터를 불러오는 중입니다.</div>

      <section id="desktopTable" class="table-card" aria-label="검색 결과">
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th class="rank-col">#</th>
                <th class="stock-col">종목</th>
                <th class="total-col">총점</th>
                <th>① %B</th>
                <th>② Swing</th>
                <th>③ SAR</th>
                <th>④ D-HA</th>
                <th>⑤ W-HA</th>
                <th>⑥ M-HA</th>
                <th>⑧ Value</th>
              </tr>
            </thead>
            <tbody id="stockTableBody"></tbody>
          </table>
        </div>
      </section>

      <section id="mobileList" class="mobile-list"></section>
      <div id="sentinel" class="sentinel" aria-hidden="true"></div>
    </main>

    <footer>Market screening · Not investment advice</footer>
  </div>

  <div id="modal" class="backdrop" aria-hidden="true">
    <article class="modal" role="dialog" aria-modal="true" aria-labelledby="modalName">
      <header class="modal-head">
        <div>
          <span id="modalTicker" class="eyebrow"></span>
          <h2 id="modalName"></h2>
        </div>
        <button id="closeModal" class="icon-btn" aria-label="닫기">×</button>
      </header>

      <section class="detail-hero">
        <div class="detail-score"><strong id="modalScore">—</strong><span>/ 2.70</span></div>
        <div class="detail-price"><strong id="modalPrice">—</strong><span id="modalChange">—</span></div>
      </section>

      <section id="scoreGrid" class="score-grid"></section>
      <section id="metricGrid" class="metric-grid"></section>

      <section class="detail-actions">
        <button id="backtestBtn" class="backtest-btn">백테스트</button>
      </section>

      <section id="backtestPanel" class="backtest-panel" hidden>
        <div class="backtest-head">
          <div>
            <span class="eyebrow">BACKTEST</span>
            <h3>과거 신호 성과</h3>
          </div>
          <span id="backtestRule" class="backtest-rule">—</span>
        </div>
        <div id="backtestSummary" class="backtest-summary"></div>

        <section id="forecastPanel" class="forecast-panel" hidden>
          <div class="forecast-head">
            <div>
              <span class="eyebrow">1 MONTH OUTLOOK</span>
              <h3>백테스트 기반 예상</h3>
            </div>
            <span id="forecastQuality" class="forecast-quality">—</span>
          </div>
          <div id="forecastSummary" class="forecast-summary"></div>
          <div id="forecastChart" class="forecast-chart"></div>
          <div class="forecast-legend">
            <span class="forecast-mean">Expected</span>
            <span class="forecast-range">25–75% range</span>
          </div>
        </section>

        <div class="backtest-table-wrap">
          <table class="backtest-table">
            <thead>
              <tr>
                <th>신호일</th>
                <th>점수</th>
                <th>5D</th>
                <th>10D</th>
                <th>20D</th>
                <th>MFE20</th>
                <th>MAE20</th>
              </tr>
            </thead>
            <tbody id="backtestBody"></tbody>
          </table>
        </div>
      </section>

      <section class="chart-card">
        <div class="chart-head">
          <b>Daily</b>
          <div id="periodTabs" class="period-tabs">
            <button data-days="20">1M</button>
            <button data-days="60">3M</button>
            <button class="active" data-days="120">6M</button>
          </div>
        </div>
        <div id="chart" class="chart"></div>
        <div class="legend"><span class="price-line">Price</span><span class="mid-line">BB Mid</span><span class="band-line">Band</span></div>
      </section>
    </article>
  </div>

  <script src="./app.js?v=20260817-ui1"></script>
</body>
</html>
