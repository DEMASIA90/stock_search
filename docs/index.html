<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#080a0f" />
  <meta name="color-scheme" content="dark" />
  <meta name="morning-invest-ui-build" content="20260817-v8_6" />
  <title>바닥의 민족 · Morning Invest</title>
  <link rel="stylesheet" href="./styles.css?v=20260817-v8_6" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand floor-brand" href="./" aria-label="바닥의 민족">
        <span class="mark floor-mark">▼</span>
        <div class="brand-copy"><b>바닥의 민족</b><small><span id="updated">—</span> · 바닥 배달중</small></div>
      </a>
      <div class="topbar-tools">
        <div class="developer-sign"><small>developed by</small><b>Morning Invest</b></div>
        <button id="reloadBtn" class="icon-btn" aria-label="새로고침">↻</button>
      </div>
    </header>

    <main>
      <nav class="market-tabs" id="marketTabs" aria-label="시장 선택">
        <button class="market-tab active" data-category="KR">국장</button>
        <button class="market-tab" data-category="US">미장</button>
        <button class="market-tab" data-category="US_ETF">미장 ETF</button>
      </nav>

      <section class="summary">
        <div>
          <h1 id="categoryTitle">국장 바닥 TOP100</h1>
          <p class="summary-kicker">낮을수록 찾고 · 돌아설 때 줍는 대형주 스캐너</p>
        </div>
        <div class="summary-meta">
          <b id="marketDate">—</b>
          <span id="coverage">—</span>
        </div>
      </section>

      <section class="search-row">
        <div class="search-box">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.5-4.5m2-5A7 7 0 1 1 4.5 11.5a7 7 0 0 1 14 0Z"/></svg>
          <input id="searchInput" type="search" autocomplete="off" placeholder="종목명 / 티커 검색" />
          <kbd id="resultCount">—</kbd>
        </div>
      </section>

      <div id="status" class="status">데이터를 불러오는 중입니다.</div>

      <section id="desktopTable" class="table-card" aria-label="검색 결과">
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th class="rank-col">#</th>
                <th class="stock-col">종목</th>
                <th class="total-col">총점</th>
                <th>① 볼린저 하단 접근</th>
                <th>② 과거 상단 이력</th>
                <th>③ 일봉 HA 반전</th>
                <th>④ 주봉 HA 양봉</th>
                <th>⑤ 월봉 HA 양봉</th>
                <th>⑥ 60일선 상승</th>
              </tr>
            </thead>
            <tbody id="stockTableBody"></tbody>
          </table>
        </div>
      </section>

      <section id="mobileList" class="mobile-list"></section>
      <div id="sentinel" class="sentinel" aria-hidden="true"></div>
    </main>

    <footer>Market screening · Not investment advice</footer>
  </div>

  <template id="detailTemplate"></template>

  <script src="./app.js?v=20260817-v8_6"></script>
</body>
</html>
