name: Morning Invest · Build & Deploy

on:
  workflow_dispatch:
    inputs:
      market:
        description: Market to refresh
        required: true
        default: ALL
        type: choice
        options:
          - ALL
          - KR
          - US
          - US_ETF
          - US_GROUP

  schedule:
    - cron: "10 16 * * 1-5"
      timezone: "Asia/Seoul"
    - cron: "10 7 * * 2-6"
      timezone: "Asia/Seoul"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: morning-invest-refresh
  cancel-in-progress: false

env:
  FIREBASE_LIVE: https://morninginv.web.app

jobs:
  build:
    name: Build ephemeral market data
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      market: ${{ steps.market.outputs.market }}

    steps:
      - name: Checkout code only
        uses: actions/checkout@v6

      - name: Resolve refresh market
        id: market
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            if [[ "${{ github.event.schedule }}" == "10 16 * * 1-5" ]]; then
              MARKET="KR"
            else
              MARKET="US_GROUP"
            fi
          else
            MARKET="${{ inputs.market }}"
          fi
          echo "market=$MARKET" >> "$GITHUB_OUTPUT"
          echo "Refresh market: $MARKET"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore unchanged market data from live hosting
        run: |
          python hydrate_data.py \
            --market "${{ steps.market.outputs.market }}" \
            --base-url "${FIREBASE_LIVE}" \
            --base-url "${GITHUB_PAGES_LIVE}"

      - name: Scan selected market
        run: python scanner.py --market "${{ steps.market.outputs.market }}"

      - name: Remove scanner-only root caches
        run: rm -f docs/data/universe_kr.json docs/data/universe_us.json docs/data/universe_us_etf.json

      - name: Verify complete deploy tree
        shell: bash
        run: |
          set -euo pipefail
          for DIR in kr us us-etf; do
            test -s "docs/data/$DIR/summary.json"
            test -s "docs/data/$DIR/bundle.zip"
            test -d "docs/data/$DIR/stocks"
          done
          echo "Generated file count:"
          find docs/data -type f | wc -l
          echo "Generated data size:"
          du -sh docs/data

      - name: Build lightweight GitHub Pages fallback
        shell: bash
        run: |
          rm -rf pages-lite
          mkdir -p pages-lite
          cp docs/index.html docs/app.js docs/styles.css pages-lite/
          touch pages-lite/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload lightweight GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./pages-lite
          include-hidden-files: true

      - name: Pack Firebase deploy artifact
        run: tar -czf morning-invest-site.tar.gz docs firebase.json .firebaserc

      - name: Upload Firebase deploy artifact
        uses: actions/upload-artifact@v7
        with:
          name: morning-invest-site
          path: morning-invest-site.tar.gz
          retention-days: 1
          if-no-files-found: error

  deploy_pages:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  deploy_firebase:
    name: Deploy Firebase Hosting
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download built site
        uses: actions/download-artifact@v5
        with:
          name: morning-invest-site

      - name: Extract built site
        run: tar -xzf morning-invest-site.tar.gz

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MORNINGINV }}
          projectId: morninginv
          channelId: live
          firebaseToolsVersion: "15.25.1"
