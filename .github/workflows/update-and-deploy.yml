name: Market Watch & Yield Monitor · Update and Deploy

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: market-watch-yield-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NHPLUG_APP_KEY: ${{ secrets.NHPLUG_APP_KEY }}
      NHPLUG_APP_SECRET: ${{ secrets.NHPLUG_APP_SECRET }}
      ASSET_WEB_ACCOUNT: ${{ secrets.ASSET_WEB_ACCOUNT }}
      PORTFOLIO_PIN: ${{ secrets.PORTFOLIO_PIN }}
      ASSET_WEB_ENV: ${{ vars.ASSET_WEB_ENV || 'live' }}
      USD_KRW_RATE: ${{ vars.USD_KRW_RATE }}
      NHPLUG_RATE_LIMIT: "3"
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_SITE_ID: ${{ vars.FIREBASE_SITE_ID }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Check out latest repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Validate hourly-update settings
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for key in NHPLUG_APP_KEY NHPLUG_APP_SECRET ASSET_WEB_ACCOUNT PORTFOLIO_PIN; do
            if [ -z "${!key:-}" ]; then
              echo "::error::$key is missing. Run configure_hourly_update.bat or add it in Settings > Secrets and variables > Actions."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          if ! [[ "$PORTFOLIO_PIN" =~ ^[0-9]{4}$ ]]; then
            echo "::error::PORTFOLIO_PIN must be exactly four digits."
            exit 1
          fi
          if [ "$ASSET_WEB_ENV" != "live" ] && [ "$ASSET_WEB_ENV" != "mock" ]; then
            echo "::error::ASSET_WEB_ENV must be live or mock."
            exit 1
          fi
          echo "Environment: $ASSET_WEB_ENV"
          echo "Account secret present: yes"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      # Portfolio history is the critical hourly job. Run it before the watchlist so
      # a transient scanner error cannot prevent account/Yield Monitor accumulation.
      - name: Update encrypted portfolio history
        run: python update_portfolio.py --non-interactive --history-days 1

      - name: Update market watch
        id: watchlist
        continue-on-error: true
        run: python update_watchlist.py --non-interactive

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Commit cumulative data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/data/portfolio.enc.json
          if [ -f docs/data/watchlist.json ]; then git add -- docs/data/watchlist.json; fi
          if git diff --cached --quiet; then
            echo "No generated data changes to commit."
            exit 0
          fi
          git commit -m "Hourly market and yield update"
          if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
            echo "::error::Git push failed. Check Settings > Actions > General > Workflow permissions (Read and write) and branch protection rules."
            exit 1
          fi

      - name: Report watchlist warning
        if: ${{ steps.watchlist.outcome == 'failure' }}
        shell: bash
        run: echo "::warning::Market Watch refresh failed, but the Yield Monitor portfolio history was updated and committed."

      - name: Set up Node.js for Firebase CLI
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON != '' && env.FIREBASE_PROJECT_ID != '' && env.FIREBASE_SITE_ID != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pinned Firebase CLI
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON != '' && env.FIREBASE_PROJECT_ID != '' && env.FIREBASE_SITE_ID != '' }}
        shell: bash
        run: |
          set -euo pipefail
          # Do not install an unpinned latest release in an hourly production job.
          # Hosting has had regressions where a successful live release returned exit 1.
          npm install -g firebase-tools@15.30.1
          firebase --version

      - name: Validate Firebase deployment settings
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON != '' && env.FIREBASE_PROJECT_ID != '' && env.FIREBASE_SITE_ID != '' }}
        shell: bash
        run: |
          set -euo pipefail
          CREDENTIALS_FILE="${RUNNER_TEMP}/firebase-service-account.json"
          CONFIG_FILE="${GITHUB_WORKSPACE}/.firebase-ci.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$CREDENTIALS_FILE"
          python - <<'PY'
          import json, os
          from pathlib import Path

          credentials = Path(os.environ["RUNNER_TEMP"], "firebase-service-account.json")
          try:
              service_account = json.loads(credentials.read_text(encoding="utf-8"))
          except Exception as exc:
              raise SystemExit(f"FIREBASE_SERVICE_ACCOUNT_JSON is not valid JSON: {exc}")

          required = ("type", "project_id", "client_email", "private_key")
          missing = [name for name in required if not service_account.get(name)]
          if missing:
              raise SystemExit(
                  "FIREBASE_SERVICE_ACCOUNT_JSON is missing required fields: " + ", ".join(missing)
              )
          if service_account.get("type") != "service_account":
              raise SystemExit("FIREBASE_SERVICE_ACCOUNT_JSON is not a service-account key.")

          target_project = os.environ["FIREBASE_PROJECT_ID"].strip()
          key_project = str(service_account.get("project_id") or "").strip()
          print(f"Firebase target project: {target_project}")
          print(f"Firebase Hosting site: {os.environ['FIREBASE_SITE_ID'].strip()}")
          print(f"Firebase service account: {service_account['client_email']}")
          if key_project and key_project != target_project:
              print(
                  f"::warning::Service-account key project ({key_project}) differs from "
                  f"FIREBASE_PROJECT_ID ({target_project}). This is valid only if that account "
                  "was explicitly granted access to the target project."
              )

          source = json.loads(Path("firebase.json").read_text(encoding="utf-8"))
          hosting = dict(source.get("hosting") or {})
          hosting["site"] = os.environ["FIREBASE_SITE_ID"].strip()
          Path(os.environ["GITHUB_WORKSPACE"], ".firebase-ci.json").write_text(
              json.dumps({"hosting": hosting}, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          PY

      - name: Deploy docs to configured Firebase Hosting site
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON != '' && env.FIREBASE_PROJECT_ID != '' && env.FIREBASE_SITE_ID != '' }}
        shell: bash
        run: |
          set -euo pipefail
          CREDENTIALS_FILE="${RUNNER_TEMP}/firebase-service-account.json"
          CONFIG_FILE="${GITHUB_WORKSPACE}/.firebase-ci.json"
          DEPLOY_LOG="${RUNNER_TEMP}/firebase-deploy.log"
          export GOOGLE_APPLICATION_CREDENTIALS="$CREDENTIALS_FILE"
          cd "$GITHUB_WORKSPACE"
          if [ ! -d "$GITHUB_WORKSPACE/docs" ]; then
            echo "::error::Firebase Hosting public directory is missing: $GITHUB_WORKSPACE/docs"
            exit 1
          fi
          echo "Firebase deploy working directory: $GITHUB_WORKSPACE"
          echo "Firebase public directory: $GITHUB_WORKSPACE/docs"
          : > "$DEPLOY_LOG"

          for attempt in 1 2 3; do
            ATTEMPT_LOG="${RUNNER_TEMP}/firebase-deploy-attempt-${attempt}.log"
            echo "===== Firebase Hosting deploy attempt ${attempt} =====" | tee -a "$DEPLOY_LOG"

            set +e
            firebase deploy \
              --only hosting \
              --project "$FIREBASE_PROJECT_ID" \
              --config "$CONFIG_FILE" \
              --non-interactive 2>&1 | tee "$ATTEMPT_LOG"
            rc=${PIPESTATUS[0]}
            set -e
            cat "$ATTEMPT_LOG" >> "$DEPLOY_LOG"

            if [ "$rc" -eq 0 ]; then
              echo "Firebase Hosting deploy succeeded."
              exit 0
            fi

            # firebase-tools has a known CI failure mode in which the release is
            # already live, but a duplicate release request returns HTTP 400.
            # Treat ONLY that exact false-negative signature as success.
            if grep -Fqi "is the current active version" "$ATTEMPT_LOG"; then
              echo "::warning::Firebase reported the new version is already the current active version. The Hosting release completed successfully; treating the known CLI false failure as success."
              exit 0
            fi

            # Authentication/authorization failures do not improve with retries.
            if grep -Eqi "Failed to authenticate|PERMISSION_DENIED|permission denied|does not have permission|HTTP Error: 401|HTTP Error: 403|Request had invalid authentication credentials" "$ATTEMPT_LOG"; then
              echo "::error::Firebase authentication/permission failure. Check FIREBASE_SERVICE_ACCOUNT_JSON and the service account's Firebase Hosting permissions."
              exit "$rc"
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Firebase deploy attempt $attempt failed; retrying in $((attempt * 10)) seconds..."
              sleep $((attempt * 10))
            fi
          done

          echo "::error::Firebase Hosting deploy failed after 3 attempts. The encrypted portfolio data was already committed to GitHub. See the Firebase deploy log artifact for the exact error."
          exit 1

      - name: Upload Firebase failure log
        if: ${{ failure() && env.FIREBASE_SERVICE_ACCOUNT_JSON != '' && env.FIREBASE_PROJECT_ID != '' && env.FIREBASE_SITE_ID != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: firebase-deploy-log-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/firebase-deploy.log
            ${{ runner.temp }}/firebase-deploy-attempt-*.log
            firebase-debug.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Hourly-update summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "### Hourly update"
            echo "- Portfolio step: ${{ job.status }}"
            echo "- Market Watch step: ${{ steps.watchlist.outcome }}"
            echo "- Scheduled minute: 17"
          } >> "$GITHUB_STEP_SUMMARY"
