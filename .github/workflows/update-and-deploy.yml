name: Morning Invest · Update & Deploy

on:
  workflow_dispatch:
    inputs:
      market:
        description: Market to refresh
        required: true
        default: ALL
        type: choice
        options:
          - ALL
          - KR
          - US

  schedule:
    # 한국장 마감 후: 평일 16:10 KST
    - cron: "10 16 * * 1-5"
      timezone: "Asia/Seoul"

    # 미국장 마감 후: 화~토 07:10 KST
    - cron: "10 7 * * 2-6"
      timezone: "Asia/Seoul"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: morning-invest-refresh
  cancel-in-progress: false

jobs:
  build:
    name: Scan market & build site
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve market
        id: market
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            if [[ "${{ github.event.schedule }}" == "10 16 * * 1-5" ]]; then
              MARKET="KR"
            else
              MARKET="US"
            fi
          else
            MARKET="${{ inputs.market }}"
          fi

          echo "market=$MARKET" >> "$GITHUB_OUTPUT"
          echo "======================================"
          echo " Morning Invest"
          echo " Refresh market: $MARKET"
          echo "======================================"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh market data
        run: python scanner.py --market "${{ steps.market.outputs.market }}"

      - name: Save generated market data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/data/*.json

          if git diff --cached --quiet; then
            echo "No market-data changes to commit."
          else
            git commit -m "data: refresh ${{ steps.market.outputs.market }} [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs
          include-hidden-files: true

  deploy_pages:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  deploy_firebase:
    name: Deploy Firebase Hosting
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # build job에서 생성한 JSON이 main에 커밋된 뒤,
      # 최신 main을 다시 체크아웃해서 Firebase에도 동일한 데이터를 배포합니다.
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Verify Firebase configuration
        shell: bash
        run: |
          test -f firebase.json || (echo "firebase.json not found" && exit 1)
          test -f .firebaserc || (echo ".firebaserc not found" && exit 1)
          test -f docs/index.html || (echo "docs/index.html not found" && exit 1)
          echo "Firebase project: morninginv"

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MORNINGINV }}
          projectId: morninginv
          channelId: live
          firebaseToolsVersion: "15.25.1"
