name: Morning Invest · Update & Deploy

on:
  workflow_dispatch:
    inputs:
      market:
        description: Market to refresh
        required: true
        default: ALL
        type: choice
        options:
          - ALL
          - KR
          - US
  push:
    branches: ["main"]
  schedule:
    - cron: "10 16 * * 1-5"
      timezone: "Asia/Seoul"
    - cron: "10 7 * * 2-6"
      timezone: "Asia/Seoul"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: morning-invest-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      refresh_market: ${{ steps.market.outputs.refresh_market }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve refresh market
        id: market
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            if [[ "${{ github.event.schedule }}" == "10 16 * * 1-5" ]]; then
              MARKET="KR"
            else
              MARKET="US"
            fi
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MARKET="${{ inputs.market }}"
          else
            MARKET="NONE"
          fi
          echo "refresh_market=$MARKET" >> "$GITHUB_OUTPUT"
          echo "Refresh market: $MARKET"

      - name: Set up Python
        if: steps.market.outputs.refresh_market != 'NONE'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        if: steps.market.outputs.refresh_market != 'NONE'
        run: pip install -r requirements.txt

      - name: Refresh market data
        if: steps.market.outputs.refresh_market != 'NONE'
        run: python scanner.py --market "${{ steps.market.outputs.refresh_market }}"

      - name: Save generated data
        if: steps.market.outputs.refresh_market != 'NONE'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/*.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: refresh ${{ steps.market.outputs.refresh_market }} [skip ci]"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
