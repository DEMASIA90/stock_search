name: Build Morning Invest APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: morning-invest-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Assemble Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android command-line tools
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic

      - name: Validate Android project
        shell: bash
        run: |
          set -euo pipefail
          test -s settings.gradle
          test -s build.gradle
          test -s app/build.gradle
          test -s app/src/main/AndroidManifest.xml
          test -s app/src/main/java/com/morninginvest/app/MainActivity.java
          grep -q "id 'com.android.application' version '8.13.2'" build.gradle
          grep -q 'compileSdk 36' app/build.gradle
          gradle --version

      - name: Build installable debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          cp "$APK" Morning-Invest-debug.apk
          sha256sum Morning-Invest-debug.apk > Morning-Invest-debug.apk.sha256
          ls -lh Morning-Invest-debug.apk Morning-Invest-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Morning-Invest-APK
          path: |
            Morning-Invest-debug.apk
            Morning-Invest-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
